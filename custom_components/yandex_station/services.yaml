reload:
  name: Reload
  description: Reload Yandex Station notify services.

send_command:
  name: Send Command
  description: Send command to Yandex.Station.
  target:
    entity:
      integration: yandex_station
      domain: media_player
  fields:
    command:
      name: Command
      description: "Command: sendText, rewind, play, stop, prev, next, playMusic, setVolume"
      example: 'sendText'
      selector:
        text:
    text:
      name: Text
      description: For sendText command
      example: Повтори за мной "Тестовое уведомление"
      selector:
        text:
    position:
      name: Position
      description: For rewind command
      example: 120
      selector:
        number:
          min: 0
          max: 3600
          mode: box
    id:
      name: ID
      description: For playMusic command
      example: '2'
      selector:
        text:
    type:
      name: Type
      description: For playMusic command (artist, track, album or playlist)
      example: 'artist'
      selector:
        text:
    volume:
      name: Volume
      description: For setVolume command
      example: 0.5
      selector:
        number:
          min: 0
          max: 1
          step: 0.01
          mode: box

matrix_send_message:
  name: Send Matrix Message
  description: Send message to Matrix room
  fields:
    message:
      name: Message
      description: Message text to send (supports Markdown)
      example: "Сейчас играет: Song Name by Artist"
      selector:
        text:
          multiline: true

yandex_music_play:
  name: Yandex Music Play
  description: Play music from Yandex Music with Plus subscription bypass
  fields:
    query:
      name: Query
      description: "Search query (e.g. 'Marilyn Manson The Beautiful People')"
      example: "Marilyn Manson The Beautiful People"
      selector:
        text:
    entity_id:
      name: Speaker
      description: Speaker entity ID (optional, uses first available if not specified)
      example: "media_player.yandex_station"
      selector:
        entity:
          domain: media_player
          integration: yandex_station
    quality:
      name: Quality
      description: "Audio quality: lossless, nq (normal), lq (low)"
      example: "lossless"
      selector:
        select:
          options:
            - "lossless"
            - "nq"
            - "lq"

test_ma_voice:
  name: Test MA Voice
  description: Emulate a voice command and play via Music Assistant
  fields:
    text:
      name: Text
      description: "Voice command text (e.g. 'включи Rammstein')"
      example: "включи Rammstein"
      selector:
        text:
    entity_id:
      name: Speaker
      description: Speaker entity ID
      example: "media_player.yandex_station"
      selector:
        entity:
          domain: media_player
          integration: yandex_station

test_ma_direct:
  name: Test MA Direct Play
  description: Play directly via Music Assistant
  fields:
    query:
      name: Query
      description: "Search query (e.g. 'Rammstein')"
      example: "Rammstein"
      selector:
        text:
    media_type:
      name: Media Type
      description: "Type: artist, track, album"
      example: "artist"
      selector:
        select:
          options:
            - "artist"
            - "track"
            - "album"
